tool: jscpd
language: javascript
language_version: "22"
technique: "Code Quality Auditing"
classification: "Code Duplication Detection"
target_files: [../../src/app.js, ../../src/app.js]
run:
  command: "npx jscpd --min-lines 3 --min-tokens 20 --reporters console src/"
expects:
  duplicate_clone_detected: false
verified_in_session: true
verified_result: "0 clones found across src/ (1 file, 26 lines, 291 tokens) — no duplication, as intended for this minimal repo"
