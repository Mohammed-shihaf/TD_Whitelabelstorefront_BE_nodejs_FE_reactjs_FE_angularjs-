tool: eslint
language: javascript
language_version: "22"
technique: "Code Quality Auditing"
classification: "Static Lint Analysis"
target_files: [../../src/]
run:
  command: "npx eslint src/"
expects:
  lint_report_generated: true
verified_in_session: true
verified_result: "ran clean against the real src/app.js (0 errors under eslint:recommended + security + sonarjs recommended configs)"
